<!DOCTYPE html>
<html>
    <head>
        <title>Coffee Everyday</title>
        <link rel="stylesheet" href="../../../components/html-components.css">
        <link rel="stylesheet" href="suppliers.css">
    </head>
    <body>
        <!--IMPORTED SIDEBAR-->
        <div id="admin-navigation-bar"></div>

        <div class="main-container">
            <!--IMPORTED HEADER-->
            <div id="admin-header"></div>

            <!--SUPPLIERS-->
            <div class="main">
                <!-- SUPPLIERS CARD -->
                <div class="suppliers-card">

                    <!-- CARD HEADER -->
                    <div class="card-header">
                        <div class="card-title">Suppliers</div>
                        <button class="button-primary add-supplier-button" id="open-new-panel-button" type="button">+ Add New Supplier</button>
                    </div>

                    <!-- SUPPLIERS TABLE -->
                    <div class="suppliers-table">
                        <div class="table-header">
                            <div class="cell-supplier-name">Supplier</div>
                            <div class="cell-categories">Item Categories</div>
                            <div class="cell-contact">Contact Platform</div>
                            <div class="cell-status">Status</div>
                            <div class="cell-actions"></div>
                        </div>

                        <div class="suppliers-body" id="suppliers-body"></div>
                    </div>
                </div>

                <!-- PANEL OVERLAY -->
                <div class="panel-overlay" id="panel-overlay"></div>

                <!-- SUPPLIER PANEL (ADD AND EDIT) -->
                <div class="panel" id="supplier-panel" aria-hidden="true">

                    <!-- PANEL HEADER -->
                    <div class="panel-header">
                        <div class="panel-heading">
                            <div class="panel-title" id="panel-title">Add new supplier</div>
                            <div class="panel-subtitle" id="panel-subtitle"></div>
                        </div>
                        <button class="close-button" id="close-panel-button" type="button" aria-label="Close panel">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                                <line x1="2" y1="2" x2="10" y2="10"></line>
                                <line x1="10" y1="2" x2="2" y2="10"></line>
                            </svg>
                        </button>
                    </div>

                    <div class="panel-body">

                        <!-- SUPPLIER DETAILS -->
                        <div class="supplier-details-row">
                            <div class="field field-grow">
                                <label class="field-label" for="supplier-name-input">Supplier name</label>
                                <input class="field-input" id="supplier-name-input" type="text" placeholder="Enter supplier name">
                            </div>
                            <div class="field field-contact">
                                <label class="field-label" for="contact-select">Contact platform</label>
                                <select class="field-input" id="contact-select" required>
                                    <option value="" disabled selected>Select contact platform</option>
                                    <option value="Facebook Messenger">Facebook Messenger</option>
                                    <option value="Shopee">Shopee</option>
                                    <option value="Viber">Viber</option>
                                    <option value="Phone call">Phone call</option>
                                    <option value="In person">In person</option>
                                </select>
                            </div>
                            <div class="field field-status">
                                <label class="field-label" for="status-select">Status</label>
                                <select class="field-input" id="status-select">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>

                        <!-- ADD ITEM -->
                        <div class="add-item-card">
                            <div class="section-title">Add item</div>

                            <div class="add-item-row">
                                <div class="field field-grow">
                                    <label class="field-label" for="item-select">Item</label>
                                    <select class="field-input" id="item-select" required>
                                        <option value="" disabled selected>Select item</option>
                                    </select>
                                </div>
                                <div class="field field-quantity">
                                    <label class="field-label" for="quantity-input">Qty</label>
                                    <input class="field-input" id="quantity-input" type="number" value="1" disabled>
                                </div>
                                <div class="field field-unit">
                                    <label class="field-label" for="unit-select">Unit</label>
                                    <select class="field-input" id="unit-select">
                                        <option value="Pack">Pack</option>
                                        <option value="Carton">Carton</option>
                                        <option value="Bottle">Bottle</option>
                                        <option value="Sleeve">Sleeve</option>
                                        <option value="Box">Box</option>
                                        <option value="Bag">Bag</option>
                                    </select>
                                </div>
                                <div class="field field-cost">
                                    <label class="field-label" for="cost-input">Cost each (&#8369;)</label>
                                    <input class="field-input" id="cost-input" type="number" min="0" step="0.01" placeholder="&#8369; 0.00">
                                </div>
                            </div>

                            <div class="add-item-row">
                                <div class="field field-amount">
                                    <label class="field-label" for="amount-input">Amount per unit</label>
                                    <input class="field-input" id="amount-input" type="number" min="0" step="any" placeholder="0">
                                </div>
                                <div class="field field-measure">
                                    <label class="field-label" for="measure-select">Measure</label>
                                    <select class="field-input" id="measure-select">
                                        <option value="mL">mL</option>
                                        <option value="L">L</option>
                                        <option value="g">g</option>
                                        <option value="kg">kg</option>
                                        <option value="pcs">pcs</option>
                                    </select>
                                </div>
                                <div class="add-item-actions">
                                    <button class="button-secondary" id="reset-button" type="button">Reset</button>
                                    <button class="button-primary" id="add-item-button" type="button">+ Add item</button>
                                </div>
                            </div>
                        </div>

                        <!-- ITEMS OFFERS -->
                        <div class="offered-items-card">
                            <div class="offered-items-heading">
                                <div class="section-title">Items offers</div>
                                <div class="offered-items-count" id="offered-items-count">0 items</div>
                            </div>

                            <div class="offered-items-table-header">
                                <div class="offered-item-name">Item</div>
                                <div class="offered-item-quantity">Qty</div>
                                <div class="offered-item-unit">Unit</div>
                                <div class="offered-item-amount">Amount</div>
                                <div class="offered-item-cost">Cost each</div>
                                <div class="offered-item-action"></div>
                            </div>

                            <div class="offered-items-list" id="offered-items-list"></div>
                        </div>
                    </div>

                    <!-- PANEL FOOTER -->
                    <div class="panel-footer">
                        <button class="button-danger delete-supplier-button" id="delete-supplier-button" type="button">Delete supplier</button>
                        <button class="button-secondary" id="cancel-button" type="button">Cancel</button>
                        <button class="button-primary" id="save-supplier-button" type="button">Add supplier</button>
                    </div>
                </div>

                <!-- SUPPLIERS SCRIPT -->
                <script src="suppliers.js"></script>
            </div>
        </div>

    <!--IMPORT SIDEBAR AND HEADER HTML-->
    <script src="../../../lib/components.js"></script>
    </body>
</html>
