<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Coffee Everyday</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="stock-adjustments.css">
    </head>
    <body>
        <!--SIDEBAR-->
        <div class="admin-navigation-bar">
            <div class="sidebar-logo">
                <div class="logo-frame">
                    <img src="../../../../assets/images/logos/brandmark-tight.png" alt="Coffee Everyday">
                </div>
            </div>

            <div class="navigation" id="admin-navLinks">
                <hr>
                <span class="section-title">GENERAL</span>

                <a href="../dashboard/dashboard.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/dashboard-icon.png" alt="Dashboard">
                        <span>Dashboard</span>
                    </div>
                </a>

                <a href="../orders/orders.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/orders-icon.png" alt="Orders">
                        <span>Orders</span>
                    </div>
                </a>

                <a href="../reports/reports.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/reports-icon.png" alt="Reports">
                        <span>Reports</span>
                    </div>
                </a>

                <hr>
                <span class="section-title">INVENTORY MANAGEMENT</span>

                <a href="../items/items.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/items-icon.png" alt="Items">
                        <span>Items</span>
                    </div>
                </a>

                <a href="../categories/categories.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/categories-icon.png" alt="Categories">
                        <span>Categories</span>
                    </div>
                </a>

                <a href="../recipes/recipes.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/recipes-icon.png" alt="Recipes">
                        <span>Recipes</span>
                    </div>
                </a>

                <a href="../stock-adjustments/stock-adjustments.html" class="active" aria-current="page">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/stockadjustments-icon.png" alt="Stock Adjustments">
                        <span>Stock Adjustments</span>
                    </div>
                </a>

                <hr>
                <span class="section-title">RESTOCKING</span>

                <a href="../purchasing-orders/purchasing-orders.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/purchasingorders-icon.png" alt="Purchasing Orders">
                        <span>Purchasing Orders</span>
                    </div>
                </a>

                <a href="../suppliers/suppliers.html">
                    <div class="frame">
                        <img src="../../../../assets/images/admin-nav/suppliers-icon.png" alt="Suppliers">
                        <span>Suppliers</span>
                    </div>
                </a>
            </div>

            <!-- Decorative coffee bean -->
            <div class="sidebar-decor" aria-hidden="true">
                <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5">
                    <g transform="rotate(35 60 60)">
                        <ellipse cx="60" cy="60" rx="30" ry="46"/>
                        <path d="M60 14c-14 20 14 36 0 46s14 26 0 46"/>
                    </g>
                </svg>
            </div>
        </div>

        <!--DRAWER OVERLAY (tablet & mobile)-->
        <div class="nav-overlay"></div>

        <div class="main-container">
            <header class="admin-header">
                <!--HAMBURGER BUTTON (tablet & mobile)-->
                <button type="button" class="menu-btn" aria-label="Open menu" aria-expanded="false">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <span class="page-title" id="page-title">Stock Adjustments</span>

                <div class="admin-header-actions">
                    <label class="admin-search-box" aria-label="Global search">
                        <img
                            class="search-icon"
                            src="../../../../assets/images/admin-header/search-icon.png"
                            alt="Search"
                        >
                        <input
                            type="search"
                            id="adminGlobalSearch"
                            placeholder="Search products, orders, or inventory..."
                        >
                    </label>

                    <button type="button" class="icon-btn notif-btn" aria-label="Notifications">
                        <img
                            src="../../../../assets/images/admin-header/notifbell-icon.png"
                            alt="Notifications"
                        >
                    </button>

                    <div class="admin-profile" id="admin-profile" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" aria-label="Open account menu">
                        <img
                            class="profile-avatar"
                            src="../../../../assets/images/admin-header/profile-icon.png"
                            alt="Admin"
                        >
                        <span class="profile-name">Admin</span>
                        <svg class="profile-caret" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="2.5,4.5 6,8 9.5,4.5"></polyline>
                        </svg>
                        <div class="profile-dropdown" id="profile-dropdown" role="menu">
                            <a href="../login/login.html" class="dropdown-item" role="menuitem">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                <span>Logout</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <!--STOCK ADJUSTMENTS-->
            <div class="main">
                <!-- ADJUSTMENTS CARD -->
                <div class="adjustments-card">

                    <!-- ADJUSTMENT FORM (ADD ONLY) -->
                    <div class="adjustment-form" id="adjustment-form">
                        <div class="adjustment-form-title">New adjustment</div>

                        <div class="adjustment-form-row">
                            <div class="field field-grow">
                                <label class="field-label" for="item-select">Item name</label>
                                <select class="field-input" id="item-select" required>
                                    <option value="" disabled selected>Select item</option>
                                    <option value="Brown Sugar">Brown Sugar</option>
                                    <option value="Butter">Butter</option>
                                    <option value="Coffee Beans">Coffee Beans</option>
                                    <option value="Cup Lid">Cup Lid</option>
                                    <option value="Heavy Cream">Heavy Cream</option>
                                    <option value="Matcha Powder">Matcha Powder</option>
                                    <option value="Paper Cup">Paper Cup</option>
                                    <option value="Powdered Sugar">Powdered Sugar</option>
                                    <option value="Vanilla Syrup">Vanilla Syrup</option>
                                    <option value="Whole Milk">Whole Milk</option>
                                </select>
                            </div>
                            <div class="field field-type">
                                <label class="field-label" for="type-select">Type</label>
                                <select class="field-input" id="type-select" required>
                                    <option value="" disabled selected>Type</option>
                                    <option value="Stock in">Stock in</option>
                                    <option value="Stock out">Stock out</option>
                                </select>
                            </div>
                            <div class="field field-quantity">
                                <label class="field-label" for="quantity-input">Qty</label>
                                <input class="field-input" id="quantity-input" type="number" min="0" step="any" placeholder="0">
                            </div>
                            <div class="field field-unit">
                                <label class="field-label" for="unit-select">Unit</label>
                                <select class="field-input" id="unit-select">
                                    <option value="mL">mL</option>
                                    <option value="L">L</option>
                                    <option value="g">g</option>
                                    <option value="kg">kg</option>
                                    <option value="pcs">pcs</option>
                                    <option value="Packets">Packets</option>
                                </select>
                            </div>
                            <div class="field field-reason">
                                <label class="field-label" for="reason-select">Reason</label>
                                <select class="field-input" id="reason-select" required disabled>
                                    <option value="" disabled selected>Reason</option>
                                </select>
                            </div>

                            <button class="button-secondary form-action-button" id="cancel-adjustment-button" type="button" aria-label="Cancel">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                                    <line x1="2" y1="2" x2="10" y2="10"></line>
                                    <line x1="10" y1="2" x2="2" y2="10"></line>
                                </svg>
                            </button>
                            <button class="button-primary form-action-button" id="save-adjustment-button" type="button" aria-label="Save adjustment">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="4 12 10 18 20 6"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- CARD HEADER -->
                    <div class="card-header">
                        <div class="card-title">Adjustment History</div>
                        <button class="button-primary new-adjustment-button" id="open-add-adjustment-button" type="button">+ New Adjustment</button>
                    </div>

                    <!-- ADJUSTMENTS TABLE -->
                    <div class="adjustments-table">
                        <div class="table-header">
                            <div class="cell-date">Date</div>
                            <div class="cell-item">Item</div>
                            <div class="cell-type">Type</div>
                            <div class="cell-quantity">Qty</div>
                            <div class="cell-unit">Unit</div>
                            <div class="cell-reason">Reason</div>
                        </div>

                        <div class="adjustments-body" id="adjustments-body"></div>
                    </div>
                </div>

                <!-- STOCK ADJUSTMENTS SCRIPT -->
                <script src="stock-adjustments.js"></script>
            </div>
        </div>

    </body>
</html>
