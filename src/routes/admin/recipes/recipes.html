<!DOCTYPE html>
<html>
    <head>
        <title>Coffee Everyday</title>
        <link rel="stylesheet" href="../../../components/html-components.css">
        <link rel="stylesheet" href="recipes.css">
    </head>
    <body>
        <!--IMPORTED SIDEBAR-->
        <div id="admin-navigation-bar"></div>

        <div class="main-container">
            <!--IMPORTED HEADER-->
            <div id="admin-header"></div>

            <!--RECIPES-->
            <div class="main">
                <!-- RECIPE BROWSER -->
                <div class="recipes-browser" id="recipes-browser">
                    <!-- CATEGORIES -->
                    <div class="recipes-categories" id="recipes-categories" aria-label="Recipe categories"></div>

                    <!-- RECIPE CARDS -->
                    <div class="recipes-catalog">
                        <div class="recipes-catalog-heading">
                            <h2 class="recipes-catalog-title" id="recipes-category-title">Coffee Specials</h2>
                            <button class="recipes-button recipes-button-primary recipes-new-button" id="recipes-new-button" type="button">+ New recipe</button>
                        </div>
                        <div class="recipes-cards" id="recipes-cards"></div>
                    </div>

                    <!-- SELECTED RECIPE -->
                    <div class="recipes-preview" id="recipes-preview" aria-live="polite"></div>
                </div>

                <!-- ADD AND EDIT RECIPE -->
                <div class="recipes-editor" id="recipes-editor" hidden>
                    <div class="recipes-editor-top">
                        <div class="recipes-editor-heading">
                            <button class="recipes-back-button" id="recipes-back-button" type="button">
                                <span aria-hidden="true">&#8249;</span> Back to recipes
                            </button>
                            <h2 class="recipes-editor-title" id="recipes-editor-title">Edit recipe</h2>
                            <p class="recipes-editor-description" id="recipes-editor-description"></p>
                        </div>
                        <div class="recipes-editor-actions">
                            <button class="recipes-button recipes-button-outline" id="recipes-cancel-edit" type="button">Cancel</button>
                            <button class="recipes-button recipes-button-primary" id="recipes-save" type="button">Save changes</button>
                        </div>
                    </div>

                    <div class="recipes-editor-columns">
                        <div class="recipes-editor-left">
                            <!-- RECIPE DETAILS -->
                            <div class="recipes-form-panel">
                                <h3 class="recipes-panel-title">Recipe details</h3>
                                <div class="recipes-details-layout">
                                    <div class="recipes-image-controls">
                                        <div class="recipes-image-preview" id="recipes-image-preview"></div>
                                        <input class="recipes-file-input" id="recipes-image-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload recipe image">
                                        <button class="recipes-button recipes-button-outline recipes-image-button" id="recipes-image-button" type="button">Change image</button>
                                        <p class="recipes-image-hint">JPG, PNG or WebP, max 5MB</p>
                                    </div>
                                    <div class="recipes-detail-fields">
                                        <div class="recipes-field">
                                            <label for="recipes-name">Recipe name</label>
                                            <input id="recipes-name" type="text" maxlength="80" placeholder="e.g. Salted Caramel" autocomplete="off">
                                        </div>
                                        <div class="recipes-field">
                                            <label for="recipes-category">Category</label>
                                            <select id="recipes-category"></select>
                                        </div>
                                        <div class="recipes-field">
                                            <label for="recipes-serving">Serving size</label>
                                            <input id="recipes-serving" type="text" maxlength="55" placeholder="e.g. 1 cup (16oz)">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- PRICING -->
                            <div class="recipes-form-panel">
                                <h3 class="recipes-panel-title">Pricing</h3>
                                <div class="recipes-pricing-fields">
                                    <div class="recipes-field">
                                        <label for="recipes-price">Menu price (&#8369;)</label>
                                        <input id="recipes-price" type="number" min="0" step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="recipes-field">
                                        <label for="recipes-labor">Labor cost (%)</label>
                                        <input id="recipes-labor" type="number" min="0" max="100" step="0.01" placeholder="0">
                                    </div>
                                </div>
                            </div>

                            <!-- COST SUMMARY -->
                            <div class="recipes-form-panel recipes-cost-panel">
                                <h3 class="recipes-panel-title">Cost summary</h3>
                                <div class="recipes-cost-summary" id="recipes-cost-summary"></div>
                            </div>
                        </div>

                        <div class="recipes-editor-right">
                            <!-- ADD INGREDIENT -->
                            <div class="recipes-form-panel">
                                <h3 class="recipes-panel-title">Add ingredient</h3>
                                <div class="recipes-add-ingredient-fields">
                                    <div class="recipes-field recipes-inventory-field">
                                        <label for="recipes-inventory-item">Item</label>
                                        <select id="recipes-inventory-item"></select>
                                    </div>
                                    <div class="recipes-field recipes-ingredient-quantity-field">
                                        <label for="recipes-inventory-quantity">Qty</label>
                                        <input id="recipes-inventory-quantity" type="number" min="0.01" step="any" placeholder="0">
                                    </div>
                                    <div class="recipes-field recipes-inventory-unit-field">
                                        <label for="recipes-inventory-unit">Unit</label>
                                        <select id="recipes-inventory-unit">
                                            <option value="">Unit</option>
                                            <option value="g">g</option>
                                            <option value="ml">ml</option>
                                            <option value="pc">pc</option>
                                        </select>
                                    </div>
                                    <button class="recipes-button recipes-button-primary recipes-add-ingredient-button" id="recipes-add-ingredient" type="button">+ Add</button>
                                </div>
                                <div class="recipes-custom-ingredient" id="recipes-custom-ingredient" hidden>
                                    <div class="recipes-field">
                                        <label for="recipes-custom-item-name">Custom item name</label>
                                        <input id="recipes-custom-item-name" type="text" maxlength="60" placeholder="Ingredient name">
                                    </div>
                                    <div class="recipes-field">
                                        <label for="recipes-custom-unit-cost">Cost per unit (&#8369;)</label>
                                        <input id="recipes-custom-unit-cost" type="number" min="0" step="0.01" placeholder="0.00">
                                    </div>
                                </div>
                                <p class="recipes-inline-message" id="recipes-add-message" role="status"></p>
                            </div>

                            <!-- INGREDIENTS -->
                            <div class="recipes-form-panel recipes-ingredients-panel">
                                <div class="recipes-ingredients-title-row">
                                    <h3 class="recipes-panel-title">Ingredients</h3>
                                    <span class="recipes-ingredient-count" id="recipes-ingredient-count">0 items</span>
                                </div>
                                <div class="recipes-ingredients-heading" aria-hidden="true">
                                    <span>Item</span>
                                    <span>Qty</span>
                                    <span>Unit</span>
                                    <span>Cost</span>
                                    <span></span>
                                </div>
                                <div class="recipes-ingredient-rows" id="recipes-ingredient-rows"></div>
                                <div class="recipes-ingredient-total">
                                    <span>Ingredient cost total</span>
                                    <strong id="recipes-ingredient-total">&#8369;0</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="recipes-form-message" id="recipes-form-message" role="alert"></p>
                </div>

                <div class="recipes-toast" id="recipes-toast" role="status" hidden></div>

                <!-- RECIPES FUNCTIONALITY -->
                <script src="recipes.js" defer></script>
            </div>
        </div>

    <!--IMPORT SIDEBAR AND HEADER HTML-->
    <script src="../../../lib/components.js"></script>
    </body>
</html>
